name: Bug report
description: Report a reproducible defect without secrets or personal data.
title: "bug: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Use synthetic/redacted data only. Never paste credentials or tracking tokens."
  - type: textarea
    id: outcome
    attributes:
      label: Observed outcome
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction steps
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [local, dev, staging, portfolio-prod, documentation-only]
    validations:
      required: true
