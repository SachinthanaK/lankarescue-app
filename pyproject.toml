[project]
name = "lankarescue-services"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["services"]
pythonpath = [
  "services/incident-api/src",
  "services/alert-ingestor/src",
  "services/resource-matcher/src",
  "services/notification-worker/src",
  "libs/auth",
  "libs/events",
  "libs/observability",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

